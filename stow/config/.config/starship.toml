"$schema" = 'https://starship.rs/config-schema.json'
add_newline = true
palette = "catppuccin_mocha"

format = """
$directory$git_branch$git_status$git_state$nodejs$python$rust$golang$docker_context$fill$cmd_duration$status$jobs$time
$line_break$character"""

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext0 = "#a6adc8"
overlay0 = "#6c7086"
surface0 = "#313244"
base = "#1e1e2e"

[directory]
style = "bold blue"
truncation_length = 0
truncate_to_repo = false
home_symbol = "~"
read_only = " 󰌾"
format = "[$path]($style)[$read_only]($read_only_style) "

[fill]
symbol = " "

[time]
disabled = false
style = "overlay0"
format = "[$time]($style)"
time_format = "%H:%M"

[status]
disabled = false
style = "red"
symbol = "✘ "
format = "[$symbol$status]($style) "

[jobs]
symbol = " "
style = "peach"
format = "[$symbol$number]($style) "

[git_branch]
symbol = " "
style = "mauve"
format = "[$symbol$branch]($style) "

[git_status]
style = "red"
format = "[$all_status$ahead_behind]($style) "

[git_state]
style = "yellow"
format = "[$state( $progress_current/$progress_total)]($style) "

[docker_context]
symbol = " "
style = "sky"
format = "[$symbol$context]($style) "

[cmd_duration]
min_time = 2000
style = "yellow"
format = "[$duration]($style)"

[character]
success_symbol = "[❯](pink)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](green)"

[nodejs]
symbol = " "
style = "green"
format = "[$symbol$version]($style) "

[python]
symbol = " "
style = "yellow"
format = "[$symbol$version]($style) "

[rust]
symbol = " "
style = "peach"
format = "[$symbol$version]($style) "

[golang]
symbol = " "
style = "teal"
format = "[$symbol$version]($style) "
