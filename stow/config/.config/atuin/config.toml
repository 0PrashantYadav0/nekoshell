# atuin: shell history in a searchable database, on Ctrl-R.
# nekoshell keeps atuin local and quiet. Nothing here talks to a server.

# No account, no upload. Run `atuin login` yourself if you ever want sync.
auto_sync = false
# The rig's version comes from Homebrew, so atuin phoning home about a release
# it cannot install only costs a shell startup a network round trip.
update_check = false

# A compact list that opens in place, rather than taking over the window.
style = "compact"
inline_height = 20
search_mode = "fuzzy"
# Up arrow stays plain zsh history (see --disable-up-arrow in .zshrc). When it
# is bound at all, it searches this session only, which is what an up arrow
# feels like it should do.
filter_mode_shell_up_key_binding = "session"
