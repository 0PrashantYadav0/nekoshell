# nekoshell tmux config. Yours to edit; nekoshell never overwrites it.
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 10
set -g focus-events on
set -g status-position top

# Prefix: C-a (C-b stays as a fallback)
set -g prefix C-a
bind C-a send-prefix
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# Splits and panes, vim style, keeping the current path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind c new-window -c "#{pane_current_path}"
setw -g mode-keys vi

# Theme and anything else nekoshell generates. Each generated file is
# nekoshell's own (the flavour, true colour, the statusbar), so a plugin or a
# flavour switch rewrites one of them and never touches this file. The glob is
# run through the shell because tmux has no glob of its own for source-file,
# and each file is tested first: none of them exists until the plugin that
# writes it is enabled, and catppuccin defaults to mocha without any of them.
run-shell 'for f in ~/.config/tmux/nekoshell-*.conf; do [ -r "$f" ] && tmux source-file "$f"; done'
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_date_time_text " %H:%M"

# Load the theme before the status line is set: the modules below are options
# catppuccin defines, so they have to exist before they are read. TPM will run
# this file again, which is harmless. Guarded, because the plugin only arrives
# once you press the install binding.
if-shell "test -f ~/.config/tmux/plugins/tmux/catppuccin.tmux" "run ~/.config/tmux/plugins/tmux/catppuccin.tmux"

set -g status-left-length 100
set -g status-right-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_directory}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_date_time}"

# Plugins. The installer clones TPM; press C-a I once inside tmux to fetch the
# rest. Guarded so this file still parses on a machine without TPM.
#
# The path is written down rather than left to TPM to guess. TPM picks
# ~/.config/tmux/plugins/ when the config lives here and ~/.tmux/plugins/ when
# it does not, and the installer has to clone into the same place or its pinned
# clone is never read and TPM fetches itself again, unpinned.
set-environment -g TMUX_PLUGIN_MANAGER_PATH "~/.config/tmux/plugins/"
set -g @plugin "tmux-plugins/tpm"
set -g @plugin "tmux-plugins/tmux-sensible"
set -g @plugin "tmux-plugins/tmux-yank"
set -g @plugin "catppuccin/tmux#v2.3.0"
if-shell "test -f ~/.config/tmux/plugins/tpm/tpm" "run ~/.config/tmux/plugins/tpm/tpm"
